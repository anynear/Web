# Builds the web app and puts it into the deploybase project (target web.anynear.app).
#
# Pull requests and merges to main: build the ANMP core, tests, production build, without publishing. Upload to
# deploybase (production) only by hand: “Run workflow” with main as pre-release X.Y.Z-pre.<build> of the open version (the
# highest release-notes/X.Y.Z.md without a tag, scripts/version.sh) or with a tag vX.Y.Z without suffix on main as the
# version X.Y.Z. The core comes from the repos ANMP and ANDP, read with the token of a GitHub App (secrets CI_APP_ID,
# CI_APP_KEY; Contents read only).
#
# For the deployment: secret DEPLOYBASE_API_KEY and variable DEPLOYBASE_PROJECT_ID. If one of them is missing,
# the run ends after the build with a notice.
name: Build and publish

on:
  push:
    branches: [main] # build and test only
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.event_name == 'push' && github.sha || github.ref }}
  # Do not cancel a running production deployment; the next merge waits.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    # Runners: GitHub's runners, unless the repository variables RUNNER_LINUX (builds) or RUNNER_RELEASE (Run workflow)
    # name others (a JSON label list). Only the project's working repository sets them.
    runs-on: ${{ fromJSON(github.event_name == 'workflow_dispatch' && vars.RUNNER_RELEASE || vars.RUNNER_LINUX || '"ubuntu-latest"') }}
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      marketing: ${{ steps.version.outputs.marketing }}
      code: ${{ steps.version.outputs.code }}
      pre: ${{ steps.version.outputs.pre }}
      deployed: ${{ steps.publish.outputs.deployed }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: Web
          fetch-depth: 0 # for checking whether the tag is on main, and the build number (commit count, ADR 0096)

      # ANMP and ANDP: while the repositories are private, a short-lived token of the organisation's GitHub App;
      # once they are public, the workflow token is enough (pull requests of forks get no secrets).
      - uses: actions/create-github-app-token@v2
        id: ci
        if: github.event.repository.private
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_KEY }}
          owner: anynear
          repositories: ${{ vars.ANMP_REPO || 'ANMP' }},${{ vars.ANDP_REPO || 'ANDP' }}

      - uses: actions/checkout@v4
        with:
          repository: anynear/${{ vars.ANMP_REPO || 'ANMP' }}
          token: ${{ steps.ci.outputs.token || github.token }}
          path: ANMP

      - uses: actions/checkout@v4
        with:
          repository: anynear/${{ vars.ANDP_REPO || 'ANDP' }}
          token: ${{ steps.ci.outputs.token || github.token }}
          path: ANDP

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build the ANMP core
        working-directory: Web
        run: node scripts/anmp.mjs

      - name: Dependencies
        working-directory: Web
        run: npm ci

      - name: Tests
        working-directory: Web
        run: npm test

      # Publishing (Run workflow with main or a tag vX.Y.Z): version and pre-release from scripts/version.sh, which also stops for
      # tags outside main; both need complete release notes in release-notes/X.Y.Z.md (README there).
      - name: Version
        id: version
        if: github.event_name == 'workflow_dispatch' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
        working-directory: Web
        run: |
          set -euo pipefail
          scripts/version.sh > "$RUNNER_TEMP/version"
          tee -a "$GITHUB_OUTPUT" < "$RUNNER_TEMP/version"
          scripts/release-notes.sh "$(sed -n 's/^marketing=//p' "$RUNNER_TEMP/version")" > /dev/null

      - name: Production build
        working-directory: Web
        env:
          # Empty outside a publishing run; vite.config.ts then works out the same version itself.
          APP_VERSION: ${{ steps.version.outputs.name }}
        run: npm run build

      # The deploybase CLI runs with `go run`; Go is not preinstalled on every runner.
      - uses: actions/setup-go@v5
        if: github.event_name == 'workflow_dispatch' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
        with:
          go-version: stable
          cache: false

      - name: Publish to deploybase (production)
        # Only by hand (Run workflow) with main or a tag vX.Y.Z.
        id: publish
        if: github.event_name == 'workflow_dispatch' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
        working-directory: Web
        env:
          DEPLOYBASE_API_KEY: ${{ secrets.DEPLOYBASE_API_KEY }}
          PROJECT_ID: ${{ vars.DEPLOYBASE_PROJECT_ID }}
        run: |
          if [ -z "$DEPLOYBASE_API_KEY" ] || [ -z "$PROJECT_ID" ]; then
            echo "::notice::DEPLOYBASE_API_KEY or DEPLOYBASE_PROJECT_ID is missing, no deployment."
            exit 0
          fi
          # Official deploybase CLI (docs.deploybase.eu/reference/cli), upload of the finished dist/.
          # Label like the version in the build: tag vX.Y.Z or pre-release vX.Y.Z-pre.<build>.
          label="${{ steps.version.outputs.tag }}"
          # Fixed version (not @latest): this step holds DEPLOYBASE_API_KEY, so only a known CLI may run here. Go checks
          # the module against sum.golang.org. Raise it on purpose after reading the changes.
          go run codeberg.org/deploybase/deploybase-cli@v0.5.0 deploy ./dist \
            --project "$PROJECT_ID" --label "Web $label" --skip-unchanged --wait
          # Otherwise index.html stays in the deploybase cache for up to an hour (s-maxage=3600).
          curl -fsS -X POST "https://api.deploybase.eu/api/v1/projects/$PROJECT_ID/cache/purge" \
            -H "Authorization: Bearer $DEPLOYBASE_API_KEY" -o /dev/null -w "Purge cache: HTTP %{http_code}\n" || echo "::warning::The cache could not be purged"
          echo "deployed=true" >> "$GITHUB_OUTPUT"

  # GitHub release of what went live, as in the app (ADR 0104): a pre-release vX.Y.Z-pre.<build> with a line on top and
  # the current state of release-notes/X.Y.Z.md, tag created on the published commit; a version vX.Y.Z with the file as
  # it is (the website shows the same text). Only after a deployment that really ran, so a copy without deploybase
  # settings creates no releases.
  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && needs.build.outputs.deployed == 'true'
    runs-on: ${{ fromJSON(github.event_name == 'workflow_dispatch' && vars.RUNNER_RELEASE || vars.RUNNER_LINUX || '"ubuntu-latest"') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          MARKETING: ${{ needs.build.outputs.marketing }}
          BUILD: ${{ needs.build.outputs.code }}
          PRE: ${{ needs.build.outputs.pre }}
        run: |
          set -euo pipefail
          if [ "$PRE" = true ]; then
            scripts/release-notes.sh --pre "$BUILD" "$MARKETING" > "$RUNNER_TEMP/release-notes.md"
          else
            scripts/release-notes.sh "$MARKETING" > "$RUNNER_TEMP/release-notes.md"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          elif [ "$PRE" = true ]; then
            gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$TAG" --verify-tag --latest --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
