# Contributor License Agreement (CLA.md): every author of a pull request agrees once by commenting the sentence below.
# The signatures are kept in this repository on the branch cla-signatures (signatures/cla.json). The workflow never
# checks out code of the pull request. It runs only where the repository variable CLA_ENABLED is "true".
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: >-
      vars.CLA_ENABLED == 'true' && (
        github.event_name == 'pull_request_target' ||
        (github.event.issue.pull_request && (
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the anynear Contributor License Agreement, version 1.0, and I agree to it.'
        ))
      )
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          branch: cla-signatures
          allowlist: kschu91,*[bot]
          custom-pr-sign-comment: I have read the anynear Contributor License Agreement, version 1.0, and I agree to it.
          custom-notsigned-prcomment: >-
            Thank you for your pull request. Before it can be considered, please read the
            [Contributor License Agreement](https://github.com/${{ github.repository }}/blob/main/CLA.md) and agree to
            it by commenting exactly the sentence below. You only need to do this once for this repository.
          custom-allsigned-prcomment: All authors of this pull request have agreed to the Contributor License Agreement.
          lock-pullrequest-aftermerge: false
